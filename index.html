<!DOCTYPE html>
<html lang="bn" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ডিজিটাল সংসার</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>
<body class="bg-amber-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans pb-10 flex flex-col justify-between transition-colors duration-300">

  <div>
    <!-- হেডার -->
    <header class="bg-emerald-700 dark:bg-emerald-900 text-white shadow-md py-6 px-4">
      <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
          <h1 class="text-3xl font-bold tracking-wide">🏡 ডিজিটাল সংসার</h1>
          <p class="text-emerald-100 dark:text-emerald-200 text-sm mt-1">দৈনন্দিন আয়-ব্যয়ের সহজ হিসাব</p>
        </div>
        
        <!-- কন্ট্রোলস: ডার্ক মোড ও মাস ফিল্টার -->
        <div class="flex items-center gap-3">
          <button id="themeToggle" title="ডার্ক/লাইট মোড টগল" class="bg-emerald-800 dark:bg-emerald-800 hover:bg-emerald-600 border border-emerald-500 rounded-lg p-2 text-sm flex items-center gap-1 transition-colors">
            <span id="themeIcon">🌙</span>
          </button>

          <div class="flex items-center gap-2">
            <input type="month" id="monthFilter" class="bg-emerald-800 dark:bg-emerald-800 text-white border border-emerald-500 rounded-lg px-3 py-1.5 text-sm focus:outline-none cursor-pointer">
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

      <!-- হিসাবের সামারি কার্ড -->
      <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- মোট আয় -->
        <div class="bg-white dark:bg-slate-800 border-l-4 border-emerald-500 rounded-xl p-5 shadow-sm transition-colors">
          <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">মোট আয়</p>
          <p id="totalIncome" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-2">৳ 0</p>
        </div>
        <!-- মোট ব্যয় -->
        <div class="bg-white dark:bg-slate-800 border-l-4 border-rose-500 rounded-xl p-5 shadow-sm transition-colors">
          <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">মোট ব্যয়</p>
          <p id="totalExpense" class="text-2xl font-bold text-rose-600 dark:text-rose-400 mt-2">৳ 0</p>
        </div>
        <!-- অবশিষ্ট/ঘাটতি -->
        <div id="balanceCard" class="bg-white dark:bg-slate-800 border-l-4 border-blue-500 rounded-xl p-5 shadow-sm transition-colors">
          <p id="balanceLabel" class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">জমা / স্থিতিপত্র</p>
          <p id="netBalance" class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-2">৳ 0</p>
        </div>
      </section>

      <!-- ইনপুট ফর্ম -->
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6 border border-amber-100 dark:border-slate-700 transition-colors">
        <h2 id="formTitle" class="text-lg font-bold text-slate-700 dark:text-slate-200 mb-4">নতুন এন্ট্রি যোগ করুন</h2>
        
        <form id="transactionForm" class="space-y-4">
          <input type="hidden" id="editId" value="">

          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <!-- বিবরণ -->
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">বিবরণ</label>
              <input type="text" id="title" placeholder="বিবরণ লিখুন (যেমন: বাজার খরচ, গাড়ি ভাড়া)" required
                class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-emerald-600">
            </div>

            <!-- পরিমাণ -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">টাকার পরিমাণ</label>
              <input type="number" id="amount" placeholder="৳ ০.০০" required min="1" step="any"
                class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-emerald-600">
            </div>

            <!-- লেনদেনের ধরন -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">ধরণ</label>
              <select id="type" required class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-emerald-600">
                <option value="expense">ব্যয় (Expense)</option>
                <option value="income">আয় (Income)</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <!-- তারিখ -->
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">তারিখ</label>
              <input type="date" id="date" required class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:outline-emerald-600">
            </div>

            <!-- সাবমিট বোতাম -->
            <div class="md:col-span-2 flex items-end gap-2">
              <button type="submit" id="submitBtn"
                class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2 rounded-lg transition-colors">
                ডাটা সেভ করুন
              </button>
              <button type="button" id="cancelEditBtn" class="hidden bg-slate-400 hover:bg-slate-500 text-white font-medium px-4 py-2 rounded-lg transition-colors">
                বাতিল
              </button>
            </div>
          </div>
        </form>
      </section>

      <!-- লেনদেনের ইতিহাস -->
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-6 border border-amber-100 dark:border-slate-700 transition-colors">
        <h2 class="text-lg font-bold text-slate-700 dark:text-slate-200 mb-4">দৈনন্দিন লেনদেনের তালিকা</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase">
                <th class="py-3 px-2">তারিখ</th>
                <th class="py-3 px-2">বিবরণ</th>
                <th class="py-3 px-2">ধরন</th>
                <th class="py-3 px-2 text-right">পরিমাণ</th>
                <th class="py-3 px-2 text-center">অ্যাকশন</th>
              </tr>
            </thead>
            <tbody id="transactionList" class="divide-y divide-slate-100 dark:divide-slate-700 text-sm">
              <!-- ডাইনামিকালি এন্ট্রি শো হবে -->
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- ফুটার -->
  <footer class="mt-12 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 text-center text-sm text-slate-600 dark:text-slate-400 transition-colors">
    <div class="max-w-4xl mx-auto px-4 space-y-1">
      <p class="font-medium">Design By <span class="font-bold text-slate-800 dark:text-slate-200">Ahteshamul Hoque</span></p>
      <p class="text-xs text-slate-500 dark:text-slate-400">Teacher at Bandarban Collectorate School and College</p>
      <p class="pt-1">
        <a href="https://www.facebook.com/Ahtesham.BU.BlackLychee" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 hover:underline inline-flex items-center gap-1 font-medium text-xs">
          Facebook Profile ↗
        </a>
      </p>
    </div>
  </footer>

  <!-- জাভাস্ক্রিপ্ট লজিক -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('transactionForm');
      const formTitle = document.getElementById('formTitle');
      const editIdInput = document.getElementById('editId');
      const submitBtn = document.getElementById('submitBtn');
      const cancelEditBtn = document.getElementById('cancelEditBtn');

      const monthFilter = document.getElementById('monthFilter');
      const transactionList = document.getElementById('transactionList');
      
      const totalIncomeEl = document.getElementById('totalIncome');
      const totalExpenseEl = document.getElementById('totalExpense');
      const netBalanceEl = document.getElementById('netBalance');
      const balanceLabelEl = document.getElementById('balanceLabel');
      const balanceCardEl = document.getElementById('balanceCard');

      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');

      // লোকাল স্টোরেজ থেকে ডাটা লোড
      let transactions = JSON.parse(localStorage.getItem('digital_songsar_data')) || [];

      // থিম ম্যানেজমেন্ট (ডার্ক মোড)
      const currentTheme = localStorage.getItem('theme') || 'light';
      if (currentTheme === 'dark') {
        document.documentElement.classList.add('dark');
        themeIcon.textContent = '☀️';
      }

      themeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeIcon.textContent = isDark ? '☀️' : '🌙';
      });

      // বর্তমান মাস সেট করা (YYYY-MM)
      const today = new Date();
      const currentMonth = today.toISOString().slice(0, 7);
      monthFilter.value = currentMonth;
      document.getElementById('date').value = today.toISOString().split('T')[0];

      // প্রথমবার UI লোড
      updateUI();

      monthFilter.addEventListener('change', updateUI);

      // ফর্ম সাবমিট (নতুন এন্ট্রি বা এডিট)
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const editId = editIdInput.value;
        const title = document.getElementById('title').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const date = document.getElementById('date').value;

        if (editId) {
          transactions = transactions.map(item => {
            if (item.id === parseInt(editId)) {
              return { ...item, title, amount, type, date };
            }
            return item;
          });
          resetForm();
        } else {
          const newTransaction = {
            id: Date.now(),
            title,
            amount,
            type,
            date
          };
          transactions.push(newTransaction);
        }

        saveAndRefresh();
      });

      cancelEditBtn.addEventListener('click', resetForm);

      function resetForm() {
        editIdInput.value = '';
        formTitle.textContent = 'নতুন এন্ট্রি যোগ করুন';
        submitBtn.textContent = 'ডাটা সেভ করুন';
        cancelEditBtn.classList.add('hidden');
        document.getElementById('title').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
      }

      function saveAndRefresh() {
        localStorage.setItem('digital_songsar_data', JSON.stringify(transactions));
        updateUI();
      }

      function updateUI() {
        const selectedMonth = monthFilter.value;
        const filteredTransactions = transactions.filter(item => item.date.startsWith(selectedMonth));

        // তারিখ অনুযায়ী সর্টিং (নতুন ডাটা আগে)
        filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));

        renderTable(filteredTransactions);
        calculateSummary(filteredTransactions);
      }

      function renderTable(items) {
        transactionList.innerHTML = '';

        if (items.length === 0) {
          transactionList.innerHTML = `
            <tr>
              <td colspan="5" class="text-center py-6 text-slate-400">এই মাসে কোনো হিসাব জমা করা হয়নি।</td>
            </tr>`;
          return;
        }

        items.forEach(item => {
          const isIncome = item.type === 'income';
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors";

          tr.innerHTML = `
            <td class="py-3 px-2 text-slate-500 dark:text-slate-400 font-mono text-xs">${item.date}</td>
            <td class="py-3 px-2 font-medium text-slate-800 dark:text-slate-200">${item.title}</td>
            <td class="py-3 px-2">
              <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${isIncome ? 'bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300' : 'bg-rose-100 dark:bg-rose-900/50 text-rose-700 dark:text-rose-300'}">
                ${isIncome ? 'আয়' : 'ব্যয়'}
              </span>
            </td>
            <td class="py-3 px-2 text-right font-bold ${isIncome ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
              ${isIncome ? '+' : '-'} ৳ ${item.amount.toLocaleString()}
            </td>
            <td class="py-3 px-2 text-center space-x-1">
              <button onclick="editTransaction(${item.id})" class="text-blue-500 hover:text-blue-700 font-bold px-1.5 py-1 text-xs transition-colors">
                এডিট
              </button>
              <button onclick="deleteTransaction(${item.id})" class="text-rose-500 hover:text-rose-700 font-bold px-1.5 py-1 text-xs transition-colors">
                ডিলিট
              </button>
            </td>
          `;
          transactionList.appendChild(tr);
        });
      }

      function calculateSummary(items) {
        let income = 0;
        let expense = 0;

        items.forEach(item => {
          if (item.type === 'income') {
            income += item.amount;
          } else {
            expense += item.amount;
          }
        });

        const net = income - expense;

        totalIncomeEl.textContent = `৳ ${income.toLocaleString()}`;
        totalExpenseEl.textContent = `৳ ${expense.toLocaleString()}`;
        netBalanceEl.textContent = `৳ ${Math.abs(net).toLocaleString()}`;

        if (net >= 0) {
          balanceLabelEl.textContent = 'অবশিষ্ট জমা (Net Savings)';
          netBalanceEl.className = 'text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-2';
          balanceCardEl.className = 'bg-white dark:bg-slate-800 border-l-4 border-emerald-500 rounded-xl p-5 shadow-sm transition-colors';
        } else {
          balanceLabelEl.textContent = 'ঘাটতি (Deficit)';
          netBalanceEl.className = 'text-2xl font-bold text-rose-600 dark:text-rose-400 mt-2';
          balanceCardEl.className = 'bg-white dark:bg-slate-800 border-l-4 border-rose-500 rounded-xl p-5 shadow-sm transition-colors';
        }
      }

      // এডিট ফাংশন
      window.editTransaction = (id) => {
        const item = transactions.find(t => t.id === id);
        if (!item) return;

        editIdInput.value = item.id;
        document.getElementById('title').value = item.title;
        document.getElementById('amount').value = item.amount;
        document.getElementById('type').value = item.type;
        document.getElementById('date').value = item.date;

        formTitle.textContent = 'এন্ট্রি পরিবর্তন করুন';
        submitBtn.textContent = 'হিসাব আপডেট করুন';
        cancelEditBtn.classList.remove('hidden');

        window.scrollTo({ top: form.offsetTop - 100, behavior: 'smooth' });
      };

      // ডিলিট ফাংশন
      window.deleteTransaction = (id) => {
        if (confirm('আপনি কি এই হিসাবটি মুছে ফেলতে চান?')) {
          transactions = transactions.filter(item => item.id !== id);
          saveAndRefresh();
        }
      };
    });
  </script>
</body>
</html>
